<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bơi Hia</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bơi Hia">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#06142b">
<style>
:root{--s:8px;--bg:#06142b;--bg2:#0b2347;--card:#0f2d57;--line:#1b4373;--tx:#eaf6ff;--mut:#8fb0cf;--aq:#2be4d6;--bl:#2f8bff;--ok:#34d399;--warn:#fbbf24;--no:#fb7185;--r:20px}
@media(prefers-color-scheme:light){:root{--bg:#eaf6ff;--bg2:#d6ecfb;--card:#fff;--line:#c4dcee;--tx:#06223f;--mut:#56738f;--aq:#0bb8ab;--bl:#1f6fe0}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{background:var(--bg);color:var(--tx);font:16px/24px -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
body{min-height:100dvh;padding-bottom:calc(var(--s)*12 + env(safe-area-inset-bottom))}
.hero{position:relative;overflow:hidden;padding:calc(env(safe-area-inset-top) + 24px) 24px 56px;background:linear-gradient(160deg,var(--bg2),var(--bl) 140%)}
.hero h1{font-size:32px;line-height:40px;font-weight:800;letter-spacing:-.5px}
.hero p{color:var(--mut);margin-top:var(--s)}
.hero .bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;min-height:40px}
.hero .bar b{font-weight:600;color:var(--mut)}
.wave{position:absolute;left:0;bottom:-1px;width:200%;height:32px;animation:w 9s linear infinite}
.wave path{fill:var(--bg)}
@keyframes w{to{transform:translateX(-50%)}}
main{padding:0 16px;margin-top:8px;display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.ev{display:grid;grid-template-columns:56px 1fr;gap:16px;align-items:start;cursor:pointer;transition:transform .15s}
.ev:active{transform:scale(.98)}
.date{width:56px;height:64px;border-radius:16px;background:linear-gradient(160deg,var(--aq),var(--bl));color:#031428;text-align:center;display:grid;align-content:center}
.date b{font-size:24px;line-height:28px;font-weight:800}.date span{font-size:12px;line-height:16px;font-weight:700;text-transform:uppercase}
.ev h3{font-size:17px;line-height:24px;font-weight:700}
.ev small,.mut{color:var(--mut);font-size:14px;line-height:20px}
.chip{display:inline-block;padding:0 12px;border-radius:99px;font-size:13px;line-height:24px;font-weight:700;border:1px solid var(--line);color:var(--mut)}
.chip.going{background:var(--ok);color:#042;border-color:var(--ok)}.chip.maybe{background:var(--warn);color:#432;border-color:var(--warn)}.chip.no{background:var(--no);color:#400;border-color:var(--no)}
.btn{display:block;width:100%;height:56px;border:0;border-radius:16px;font:700 17px/24px inherit;font-family:inherit;color:#031428;background:linear-gradient(90deg,var(--aq),var(--bl));cursor:pointer;transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--no);border:1px solid var(--no)}
.btn.sm{height:40px;font-size:15px;width:auto;padding:0 16px}
.icon{border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--tx);height:40px;min-width:40px;padding:0 12px;border-radius:99px;font:600 15px inherit;font-family:inherit;cursor:pointer}
input,textarea{width:100%;height:56px;border-radius:16px;border:1px solid var(--line);background:var(--bg);color:var(--tx);padding:0 16px;font:inherit;outline:0}
textarea{height:96px;padding:16px;resize:none}
input:focus,textarea:focus{border-color:var(--aq);box-shadow:0 0 0 3px color-mix(in srgb,var(--aq) 25%,transparent)}
label{display:grid;gap:8px;font-weight:600;font-size:14px;color:var(--mut)}
.form{display:grid;gap:16px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{height:56px;border-radius:16px;border:1px solid var(--line);background:transparent;color:var(--tx);font:600 15px inherit;font-family:inherit;cursor:pointer;transition:all .15s}
.seg button.on[data-s=going]{background:var(--ok);color:#042;border-color:var(--ok)}
.seg button.on[data-s=maybe]{background:var(--warn);color:#432;border-color:var(--warn)}
.seg button.on[data-s=no]{background:var(--no);color:#400;border-color:var(--no)}
h2{font-size:20px;line-height:28px;font-weight:800;margin-bottom:16px}
.opt{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;height:56px;padding:0 16px;border-radius:16px;border:1px solid var(--line);margin-bottom:8px;cursor:pointer;font-weight:600}
.opt i{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--aq) 22%,transparent);transition:width .4s;z-index:0}
.opt span{position:relative;z-index:1}
.opt.mine{border-color:var(--aq)}.opt.win{border-color:var(--warn);box-shadow:0 0 0 2px color-mix(in srgb,var(--warn) 40%,transparent)}
.row{display:flex;gap:8px;align-items:center}.row>input{flex:1}
.people{display:flex;flex-wrap:wrap;gap:8px}
.back{margin-bottom:0}
.empty{text-align:center;color:var(--mut);padding:32px 16px}
.mem{display:flex;justify-content:space-between;align-items:center;min-height:40px}
.fab{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:5}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 16px);transform:translate(-50%,-80px);background:var(--card);border:1px solid var(--line);padding:8px 16px;border-radius:99px;font-weight:600;transition:transform .3s;z-index:9}
.toast.on{transform:translate(-50%,0)}
.bar .g{display:flex;gap:8px}.hero .bar b{max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
[hidden]{display:none!important}.soft .fade{animation:none}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.acts .btn{font-size:15px}
.opt.rank{cursor:default}
.fade{animation:f .25s ease-out}@keyframes f{from{opacity:0;transform:translateY(8px)}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = p => { p = p.replace(/\D/g, ''); return p.startsWith('84') ? '0' + p.slice(2) : p };
let me = JSON.parse(localStorage.me || 'null');
const isAdmin = () => me && me.phone === norm(ADMIN_PHONE) && !!localStorage.pin;
const WAVE = '<svg class="wave" viewBox="0 0 1200 32" preserveAspectRatio="none"><path d="M0 16C100 0 200 0 300 16S500 32 600 16s200-16 300 0 200 16 300 0V32H0Z"/></svg>';
const dt = s => new Date(s).toLocaleString('vi-VN', { weekday: 'short', hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' });
const LBL = { going: 'Đi', maybe: 'Có thể', no: 'Bận' };
let t;
const toast = m => { const e = $('#toast'); e.textContent = m; e.classList.add('on'); clearTimeout(t); t = setTimeout(() => e.classList.remove('on'), 2200) };
const fail = e => toast('Lỗi: ' + (e?.message || 'thử lại nhé'));
const hero = (title, sub, left) => `<div class="hero"><div class="bar">${left}<b>${esc(me?.name || '')}${isAdmin() ? ' · Admin' : ''}</b></div><h1>${title}</h1>${sub ? `<p>${sub}</p>` : ''}${WAVE}</div>`;

/* ---------- Khung chung ---------- */
let cur = null, soft = false, vtok = 0, liveOn = false, rtimer;
const paint = h => { app.innerHTML = h; app.classList.toggle('soft', soft); soft = false };
const rpc = (fn, a = {}) => db.rpc(fn, { p_pin: localStorage.pin, ...a });
const refresh = () => { clearTimeout(rtimer); rtimer = setTimeout(() => { if (me && cur && !document.activeElement?.matches('input,textarea')) { soft = true; cur() } }, 400) };
const live = () => { if (liveOn) return; liveOn = true; const ch = db.channel('bh'); ['members', 'events', 'rsvps', 'options', 'votes'].forEach(t => ch.on('postgres_changes', { event: '*', schema: 'public', table: t }, refresh)); ch.subscribe() };
document.addEventListener('visibilitychange', () => !document.hidden && refresh());
const share = async e => { const text = `🏊 ${e.title}\n${dt(e.starts_at)}${e.place ? ' · ' + e.place : ''}`; try { navigator.share ? await navigator.share({ text, url: location.origin }) : (await navigator.clipboard.writeText(text + '\n' + location.origin), toast('Đã copy ✓')) } catch { } };
const cal = e => {
  const f = d => new Date(d).toISOString().replace(/[-:]|\.\d{3}/g, ''), x = s => (s || '').replace(/[,;\n\\]/g, ' ');
  const b = new Blob([['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//BoiHia//VI', 'BEGIN:VEVENT', `UID:${e.id}@boihia`, `DTSTAMP:${f(Date.now())}`, `DTSTART:${f(e.starts_at)}`, `DTEND:${f(+new Date(e.starts_at) + 72e5)}`, `SUMMARY:${x(e.title)}`, `LOCATION:${x(e.place)}`, 'END:VEVENT', 'END:VCALENDAR'].join('\r\n')], { type: 'text/calendar' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'boi-hia.ics'; a.click();
};
const logout = () => { localStorage.removeItem('me'); localStorage.removeItem('pin'); me = null; login() };

/* ---------- Đăng nhập ---------- */
function login() {
  cur = null; vtok++;
  paint(`<div class="hero"><h1>Bơi Hia 🏊</h1><p>Hội bơi lội &amp; bia sau bơi</p>${WAVE}</div>
  <main class="fade"><form class="card form" id="f">
    <label>Số điện thoại<input id="p" type="tel" inputmode="tel" placeholder="0901234567" autocomplete="tel" required></label>
    <label>Tên của bạn (lần đầu)<input id="n" placeholder="Ví dụ: Hia Tuấn" maxlength="24"></label>
    <label id="pl" hidden>PIN admin<input id="pin" type="password" inputmode="numeric" autocomplete="off"></label>
    <button class="btn">Vào hội</button></form></main>`);
  $('#p').oninput = () => $('#pl').hidden = norm($('#p').value) !== norm(ADMIN_PHONE);
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const phone = norm($('#p').value), name = $('#n').value.trim();
    if (!/^0\d{9}$/.test(phone)) return toast('Số điện thoại gồm 10 chữ số');
    if (phone === norm(ADMIN_PHONE)) {
      const pin = $('#pin').value, { data: ok, error: pe } = await db.rpc('admin_check', { p_pin: pin });
      if (pe) return fail(pe); if (!ok) return toast('Sai PIN admin');
      localStorage.pin = pin;
    }
    let { data: m, error } = await db.from('members').select('*').eq('phone', phone).maybeSingle();
    if (error) return fail(error);
    if (!m) {
      if (!name) return toast('Lần đầu cần nhập tên');
      ({ data: m, error } = await db.from('members').insert({ phone, name }).select().single());
      if (error) return fail(error);
    }
    me = m; localStorage.me = JSON.stringify(m); home();
  };
}

/* ---------- Danh sách sự kiện ---------- */
async function home() {
  const k = ++vtok; cur = home; live();
  const [{ data: evs, error }, { data: rs }] = await Promise.all([
    db.from('events').select('*').order('starts_at'), db.from('rsvps').select('*')]);
  if (error) return fail(error); if (k !== vtok) return;
  const mine = Object.fromEntries((rs || []).filter(r => r.phone === me.phone).map(r => [r.event_id, r.status]));
  const going = {}; (rs || []).filter(r => r.status === 'going').forEach(r => going[r.event_id] = (going[r.event_id] || 0) + 1);
  const now = Date.now() - 864e5;
  const up = evs.filter(e => +new Date(e.starts_at) >= now), past = evs.filter(e => +new Date(e.starts_at) < now).reverse();
  const card = e => { const d = new Date(e.starts_at); return `<div class="card ev" data-id="${e.id}">
    <div class="date"><b>${d.getDate()}</b><span>Th${d.getMonth() + 1}</span></div>
    <div><h3>${esc(e.title)}</h3><small>${d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })} · ${esc(e.place || 'Chưa có địa điểm')}</small><br><small>🏊 ${going[e.id] || 0} người đi${e.vote_closed ? ' · 🍺 đã chốt' : ''}</small><div style="margin-top:8px">${mine[e.id] ? `<span class="chip ${mine[e.id]}">${LBL[mine[e.id]]}</span>` : '<span class="chip">Chưa trả lời</span>'}</div></div></div>` };
  paint(hero('Lịch bơi', `${up.length} sự kiện sắp tới`,
    `<div class="g"><button class="icon" id="out">Thoát</button><button class="icon" id="top" aria-label="Xếp hạng">🏆</button>${isAdmin() ? '<button class="icon" id="mem" aria-label="Thành viên">👥</button>' : ''}</div>`) +
    `<main class="fade">${up.map(card).join('') || '<div class="card empty">Chưa có sự kiện nào 🌊</div>'}
    ${past.length ? `<p class="mut" style="margin-top:8px">Đã qua</p>${past.map(card).join('')}` : ''}</main>
    ${isAdmin() ? '<div class="fab"><button class="btn" id="new">+ Tạo sự kiện</button></div>' : ''}`);
  app.querySelectorAll('.ev').forEach(c => c.onclick = () => event(c.dataset.id));
  $('#out').onclick = logout; $('#top').onclick = board;
  if (isAdmin()) { $('#new').onclick = () => form(); $('#mem').onclick = members }
}

/* ---------- Tạo / sửa sự kiện (admin) ---------- */
function form(e) {
  cur = null; vtok++;
  const loc = e ? new Date(+new Date(e.starts_at) - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 16) : '';
  paint(hero(e ? 'Sửa sự kiện' : 'Sự kiện mới', '', `<button class="icon" id="b">← ${e ? 'Quay lại' : 'Lịch'}</button>`) + `<main class="fade"><form class="card form" id="f">
    <label>Tên<input id="t" placeholder="Bơi sáng Chủ nhật" required maxlength="60" value="${esc(e?.title)}"></label>
    <label>Ngày giờ<input id="d" type="datetime-local" required value="${loc}"></label>
    <label>Địa điểm<input id="pl" placeholder="Hồ bơi..." maxlength="80" value="${esc(e?.place)}"></label>
    <label>Ghi chú<textarea id="no" maxlength="300">${esc(e?.note)}</textarea></label>
    <button class="btn">${e ? 'Lưu' : 'Tạo'}</button></form></main>`);
  $('#b').onclick = () => e ? event(e.id) : home();
  $('#f').onsubmit = async ev => {
    ev.preventDefault();
    const { data, error } = await rpc('admin_save_event', { p_id: e?.id ?? null, p_title: $('#t').value.trim(), p_starts: new Date($('#d').value).toISOString(), p_place: $('#pl').value.trim(), p_note: $('#no').value.trim() });
    if (error) return fail(error); toast(e ? 'Đã lưu ✓' : 'Đã tạo ✓'); event(data);
  };
}

/* ---------- Chi tiết sự kiện + vote bia ---------- */
async function event(id) {
  const k = ++vtok; cur = () => event(id);
  const [{ data: e }, { data: rs }, { data: os }, { data: vs }] = await Promise.all([
    db.from('events').select('*').eq('id', id).maybeSingle(),
    db.from('rsvps').select('*, members(name)').eq('event_id', id),
    db.from('options').select('*').eq('event_id', id).order('created_at'),
    db.from('votes').select('*').eq('event_id', id)]);
  if (k !== vtok) return; if (!e) return home();
  const my = rs.find(r => r.phone === me.phone)?.status, myVote = vs.find(v => v.phone === me.phone)?.option_id;
  const cnt = Object.fromEntries(os.map(o => [o.id, vs.filter(v => v.option_id === o.id).length]));
  const max = Math.max(0, ...Object.values(cnt)), total = vs.length || 1;
  const who = s => rs.filter(r => r.status === s).map(r => `<span class="chip ${s}">${esc(r.members?.name)}</span>`).join('') || '<span class="mut">—</span>';
  paint(hero(esc(e.title), `${dt(e.starts_at)} · ${esc(e.place || 'Chưa có địa điểm')}`, '<button class="icon" id="b">← Lịch</button>') +
  `<main class="fade">
    ${e.note ? `<div class="card mut">${esc(e.note)}</div>` : ''}
    <div class="card"><h2>Bạn đi không?</h2><div class="seg">${['going', 'maybe', 'no'].map(s => `<button data-s="${s}" class="${my === s ? 'on' : ''}">${{ going: '🏊 Đi', maybe: '🤔 Có thể', no: '😴 Bận' }[s]}</button>`).join('')}</div></div>
    <div class="acts"><button class="btn ghost" id="sh">📤 Chia sẻ</button><button class="btn ghost" id="ca">📅 Thêm lịch</button></div>
    <div class="card"><h2>Ai đi</h2><div class="people">${who('going')}</div>
      <p class="mut" style="margin:16px 0 8px">Có thể</p><div class="people">${who('maybe')}</div>
      <p class="mut" style="margin:16px 0 8px">Bận</p><div class="people">${who('no')}</div></div>
    <div class="card"><h2>🍺 Đi uống bia ở đâu?</h2>
      ${os.map(o => `<div class="opt ${myVote === o.id ? 'mine' : ''} ${e.vote_closed && cnt[o.id] === max && max ? 'win' : ''}" data-o="${o.id}"><i style="width:${cnt[o.id] / total * 100}%"></i><span>${e.vote_closed && cnt[o.id] === max && max ? '🍺 ' : myVote === o.id ? '✓ ' : ''}${esc(o.label)}</span><span>${cnt[o.id]}</span></div>`).join('') || '<p class="mut" style="margin-bottom:8px">Chưa có lựa chọn. Thêm đi nào!</p>'}
      ${e.vote_closed ? '<p class="mut">Đã chốt vote.</p>' : `<form class="row" id="af" style="margin-top:16px"><input id="ol" placeholder="Quán / giờ..." maxlength="60" required><button class="btn sm">Thêm</button></form>`}
    </div>
    ${isAdmin() ? `<div class="card form"><button class="btn ghost" id="ed">✏️ Sửa sự kiện</button><button class="btn ghost" id="cl">${e.vote_closed ? 'Mở lại vote' : '🔒 Chốt vote'}</button><button class="btn danger" id="del">Xoá sự kiện</button></div>` : ''}
  </main>`);
  $('#b').onclick = home; $('#sh').onclick = () => share(e); $('#ca').onclick = () => cal(e);
  app.querySelectorAll('.seg button').forEach(b => b.onclick = async () => {
    const { error } = await db.from('rsvps').upsert({ event_id: id, phone: me.phone, status: b.dataset.s }); error ? fail(error) : event(id) });
  app.querySelectorAll('.opt').forEach(o => o.onclick = async () => {
    if (e.vote_closed) return toast('Vote đã chốt');
    const { error } = await db.from('votes').upsert({ event_id: id, phone: me.phone, option_id: o.dataset.o }); error ? fail(error) : event(id) });
  if (!e.vote_closed) $('#af').onsubmit = async ev => { ev.preventDefault();
    const { error } = await db.from('options').insert({ event_id: id, label: $('#ol').value.trim(), added_by: me.phone }); error ? fail(error) : event(id) };
  if (isAdmin()) {
    $('#ed').onclick = () => form(e);
    $('#cl').onclick = async () => { const { error } = await rpc('admin_set_closed', { p_id: id, p_closed: !e.vote_closed }); error ? fail(error) : event(id) };
    $('#del').onclick = async () => { if (!confirm('Xoá sự kiện này? Không hoàn tác được.')) return;
      const { error } = await rpc('admin_delete_event', { p_id: id }); error ? fail(error) : home() };
  }
}

/* ---------- Bảng vàng: ai bơi nhiều nhất ---------- */
async function board() {
  const k = ++vtok; cur = board;
  const { data, error } = await db.from('rsvps').select('phone, members(name), events(starts_at)').eq('status', 'going');
  if (error) return fail(error); if (k !== vtok) return;
  const now = Date.now(), c = {};
  data.filter(r => r.events && +new Date(r.events.starts_at) < now).forEach(r => { const x = c[r.phone] ??= { n: r.members?.name, c: 0 }; x.c++ });
  const rows = Object.values(c).sort((a, b) => b.c - a.c).slice(0, 10), top = rows[0]?.c || 1;
  paint(hero('Bảng vàng 🏆', 'Ai bơi nhiều nhất', '<button class="icon" id="b">← Lịch</button>') +
    `<main class="fade"><div class="card">${rows.map((r, i) => `<div class="opt rank${i === 0 ? ' win' : ''}"><i style="width:${r.c / top * 100}%"></i><span>${['🥇', '🥈', '🥉'][i] || (i + 1) + '.'} ${esc(r.n)}</span><span>${r.c} buổi</span></div>`).join('') || '<p class="empty">Chưa có buổi bơi nào đã qua 🌊</p>'}</div></main>`);
  $('#b').onclick = home;
}

/* ---------- Thành viên (admin) ---------- */
async function members() {
  const k = ++vtok; cur = members;
  const { data, error } = await db.from('members').select('*').order('name'); if (error) return fail(error); if (k !== vtok) return;
  paint(hero('Thành viên', `${data.length} người`, '<button class="icon" id="b">← Lịch</button>') +
    `<main class="fade"><div class="card">${data.map(m => `<div class="mem"><div>${esc(m.name)}<br><span class="mut">${esc(m.phone)}</span></div>${m.phone === me.phone ? '' : `<button class="btn danger sm" data-p="${esc(m.phone)}">Xoá</button>`}</div>`).join('')}</div></main>`);
  $('#b').onclick = home;
  app.querySelectorAll('[data-p]').forEach(b => b.onclick = async () => { if (!confirm('Xoá thành viên này?')) return;
    const { error } = await rpc('admin_delete_member', { p_phone: b.dataset.p }); error ? fail(error) : members() });
}

(async () => {
  if (me && me.phone === norm(ADMIN_PHONE) && !localStorage.pin) me = null; // admin phải nhập PIN
  if (me) { const { data } = await db.from('members').select('phone').eq('phone', me.phone).maybeSingle(); if (!data) me = null; } // bị admin xoá → về đăng nhập
  me ? home() : login();
})();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
